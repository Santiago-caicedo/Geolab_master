{% comment %}Estilos compartidos del esquema "registro" (lista de informes, expediente de obra).{% endcomment %}
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
    /* Esquema "registro" de Geolab: filas compactas, números (INF, OT) como etiquetas de muestra.
       Lo usan lista_informes_obra y detalle_obra; todo va bajo .inf */
    .inf {
        --inf-ink: #1c2e4a;        /* azul Geolab profundo: títulos */
        --inf-text: #334155;
        --inf-muted: #64748b;      /* 4.8:1 sobre blanco */
        --inf-line: #e6eaf0;
        --inf-hover: #f5f8fc;
        --inf-label-bg: #eaf2fa;
        --inf-label-ink: #12406b;
        --inf-link: #0b6ea8;       /* azul de marca oscurecido para texto: 5.2:1 */
        --inf-danger: #b42318;
        --inf-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--inf-text);
        font-size: .875rem;
    }

    /* Encabezado */
    .inf-crumbs { font-size: .8rem; margin-bottom: .75rem; }
    .inf-crumbs a { color: var(--inf-muted); text-decoration: none; }
    .inf-crumbs a:hover { color: var(--inf-link); text-decoration: underline; }
    .inf-crumbs .sep { color: #cbd5e1; margin: 0 .35rem; }
    .inf-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .inf-eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--inf-muted); }
    .inf-title { font-size: 1.25rem; font-weight: 600; color: var(--inf-ink); margin: .1rem 0 .2rem; line-height: 1.3; }
    .inf-code { font-family: var(--inf-mono); font-size: .75rem; font-weight: 500; color: var(--inf-muted);
                border: 1px solid var(--inf-line); border-radius: 4px; padding: .05rem .4rem; margin-left: .4rem; vertical-align: middle; white-space: nowrap; }
    .inf-meta { color: var(--inf-muted); font-size: .8125rem; }
    .inf-meta strong { color: var(--inf-text); font-weight: 600; }
    .inf-actions { display: flex; gap: .5rem; flex-wrap: wrap; }

    /* Panel */
    .inf-panel { background: #fff; border: 1px solid var(--inf-line); border-radius: 10px; overflow: hidden; }
    .inf-toolbar { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; padding: .625rem .75rem; border-bottom: 1px solid var(--inf-line); }
    .inf-toolbar .inf-search { position: relative; flex: 1 1 260px; max-width: 380px; }
    .inf-toolbar .inf-search i { position: absolute; left: .6rem; top: 50%; transform: translateY(-50%); color: var(--inf-muted); font-size: .8rem; pointer-events: none; }
    .inf-toolbar .inf-search input { padding-left: 1.85rem; }
    .inf-toolbar .form-control, .inf-toolbar .btn { font-size: .8125rem; height: 32px; }
    .inf-date { display: flex; align-items: center; gap: .35rem; font-size: .75rem; color: var(--inf-muted); }
    .inf-date input { width: 138px; }
    .inf-count { margin-left: auto; color: var(--inf-muted); font-size: .8125rem; white-space: nowrap; }
    .inf-count strong { color: var(--inf-text); }
    .inf-clear { font-size: .8125rem; color: var(--inf-link); text-decoration: none; white-space: nowrap; }
    .inf-clear:hover { text-decoration: underline; }

    /* Barra de selección (reemplaza la de filtros mientras hay elegidos) */
    .inf-selbar { display: none; align-items: center; gap: .75rem; padding: .625rem .75rem; border-bottom: 1px solid #f3d6d3; background: #fdf3f2; }
    .inf.seleccionando .inf-selbar { display: flex; }
    .inf.seleccionando .inf-toolbar { display: none; }
    .inf-selbar .btn { font-size: .8125rem; height: 32px; }

    /* Tabla */
    .inf-table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 0; }
    .inf-table thead th {
        background: #fafbfd;
        font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--inf-muted);
        padding: .5rem .75rem; border-bottom: 1px solid var(--inf-line); white-space: nowrap;
    }
    .inf-table td { padding: .4rem .75rem; border-bottom: 1px solid var(--inf-line); vertical-align: middle; line-height: 1.35; }
    .inf-table tbody tr.inf-row:hover td { background: var(--inf-hover); }
    .inf-table tbody tr.inf-row.elegido td { background: #fdf3f2; }
    .inf-table tr:last-child td { border-bottom: 0; }
    .inf-check { width: 36px; padding-right: 0 !important; }
    .inf-check .form-check-input { margin: 0; cursor: pointer; vertical-align: middle; }

    .inf-table .inf-mes td {
        background: #fff; padding: .9rem .75rem .35rem; border-bottom: 0;
        font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--inf-ink);
    }
    .inf-mes td::after { content: ''; display: block; height: 1px; background: var(--inf-ink); opacity: .12; margin-top: .35rem; }

    .inf-num {
        display: inline-block; font-family: var(--inf-mono); font-size: .78rem; font-weight: 500;
        color: var(--inf-label-ink); background: var(--inf-label-bg);
        border-radius: 4px; padding: .12rem .45rem; letter-spacing: .01em; white-space: nowrap;
    }
    .inf-num.vacio { background: transparent; color: #cbd5e1; padding-left: 0; }
    .inf-tipo { color: var(--inf-text); }
    .inf-tipo small { display: none; color: var(--inf-muted); font-family: var(--inf-mono); font-size: .72rem; }
    .inf-fecha { font-family: var(--inf-mono); font-size: .78rem; color: var(--inf-muted); white-space: nowrap; text-align: right; }

    .inf-acc { text-align: right; white-space: nowrap; width: 1%; }
    .inf-open {
        display: inline-flex; align-items: center; gap: .3rem; height: 28px; padding: 0 .6rem;
        font-size: .8125rem; font-weight: 500; color: var(--inf-link); text-decoration: none; border-radius: 6px;
    }
    .inf-open:hover { background: #e6f1fa; color: #075985; }
    .inf-nofile { font-size: .75rem; color: var(--inf-muted); padding: 0 .6rem; }
    .inf .inf-del {
        display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
        border: 0; background: transparent; color: #94a3b8; border-radius: 6px; margin-left: .15rem;
    }
    .inf .inf-del:hover { background: #fdecea; color: var(--inf-danger); }
    .inf a:focus-visible, .inf button:focus-visible, .inf input:focus-visible {
        outline: 2px solid var(--inf-link); outline-offset: 2px; box-shadow: none;
    }

    /* Pie */
    .inf-foot { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap;
                padding: .5rem .75rem; border-top: 1px solid var(--inf-line); font-size: .8125rem; color: var(--inf-muted); }
    .inf-pages { display: flex; gap: .15rem; align-items: center; }
    .inf-pages a, .inf-pages span {
        min-width: 28px; height: 28px; padding: 0 .45rem; display: inline-flex; align-items: center; justify-content: center;
        border-radius: 6px; color: var(--inf-text); text-decoration: none; font-variant-numeric: tabular-nums;
    }
    .inf-pages a:hover { background: var(--inf-hover); }
    .inf-pages .actual { background: var(--inf-ink); color: #fff; font-weight: 600; }
    .inf-pages .gap { color: #cbd5e1; }

    /* Vacío */
    .inf-empty { text-align: center; padding: 3rem 1rem; }
    .inf-empty i { font-size: 1.75rem; color: #cbd5e1; }
    .inf-empty p { margin: .5rem 0 1rem; color: var(--inf-muted); }

    /* Modal de borrado */
    .inf-modal .modal-content { border: 0; border-radius: 12px; }
    .inf-modal .modal-title { font-size: 1rem; font-weight: 600; color: var(--inf-ink); }
    .inf-modal ul { list-style: none; padding: 0; margin: .75rem 0; max-height: 180px; overflow-y: auto; }
    .inf-modal li { padding: .25rem 0; border-bottom: 1px dashed var(--inf-line); font-size: .8125rem; }
    .inf-modal .nota { font-size: .78rem; color: var(--inf-muted); }

    @media (max-width: 767.98px) {
        .inf-col-fecha { display: none; }
        .inf-tipo small { display: block; }
        .inf-date input { width: 128px; }
        .inf-count { margin-left: 0; width: 100%; }
        .inf-open .txt { display: none; }
        .inf-table td, .inf-table th { padding-left: .5rem; padding-right: .5rem; }
    }
    @media (prefers-reduced-motion: reduce) { .inf * { transition: none !important; } }
</style>
