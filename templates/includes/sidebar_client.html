{% load static %}
<nav class="sidebar" style="background-color: #1e293b;">
    <a href="/" class="sidebar-brand">
        <img src="{% static 'img/geolab-logo.png' %}" alt="Portal Clientes" style="width: 160px; height: auto;">
    </a>
    
    <div class="d-flex flex-column py-2 h-100">
        
        <div class="px-4 py-3 mb-2 bg-black bg-opacity-25 border-bottom border-secondary">
            <small class="text-white-50 d-block text-uppercase fw-bold" style="font-size: 0.65rem; letter-spacing: 1px;">Empresa</small>
            <div class="fw-bold text-white text-truncate">{{ user.perfil_cliente.empresa.nombre }}</div>
        </div>

        <div class="nav-section">MI CUENTA</div>
        
        <a href="/" class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
            <i class="bi bi-grid-fill"></i> Resumen
        </a>
        
        <a href="{% url 'lista_informes' %}" class="nav-link {% if 'informes' in request.path %}active{% endif %}">
            <i class="bi bi-file-earmark-pdf-fill"></i> Mis Informes
        </a>
        
        {% if user.perfil_cliente.rol == 'director' %}
        <div class="nav-section">DIRECTOR</div>
        <a href="#" class="nav-link">
            <i class="bi bi-buildings"></i> Mis Obras (Todas)
        </a>
        {% endif %}

        <div class="nav-section">AYUDA</div>
        <a href="#" class="nav-link">
            <i class="bi bi-whatsapp"></i> Soporte Técnico
        </a>

        <div class="flex-grow-1"></div>

        <div class="p-3">
            <form action="{% url 'admin:logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn w-100 btn-sm d-flex align-items-center justify-content-center gap-2 shadow-sm text-white" 
                        style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1);">
                    <i class="bi bi-box-arrow-left"></i> Cerrar Sesión
                </button>
            </form>
        </div>
    </div>
</nav>
