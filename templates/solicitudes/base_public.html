{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Remisión de Muestras{% endblock %} - Geolab</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --brand-blue: #008ed6;
            --brand-grey: #9ca3af;
            --sidebar-bg: #1c2e4a;
            --accent-color: var(--brand-blue);
            --bg-body: #f8fafc;
            --text-main: #334155;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
        }

        .header-brand {
            background-color: var(--sidebar-bg);
            padding: 1.25rem 2rem;
        }

        .header-brand img {
            height: 70px;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .card-custom {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.06);
            background: white;
        }

        .badge-soft { padding: 0.35em 0.65em; font-size: 0.75em; font-weight: 600; border-radius: 6px; }
        .bg-soft-blue { background-color: #eff6ff; color: #1d4ed8; }
        .bg-soft-red { background-color: #fef2f2; color: #dc2626; }

        .orden-trabajo {
            color: #dc2626;
            font-weight: 700;
            font-size: 1.25rem;
        }

        /* Estilos para la tabla de muestras */
        .table-muestras {
            font-size: 0.85rem;
        }

        .table-muestras th {
            background-color: var(--sidebar-bg);
            color: white;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            vertical-align: middle;
            text-align: center;
            padding: 0.75rem 0.5rem;
        }

        .table-muestras th.vertical-text {
            writing-mode: vertical-lr;
            transform: rotate(180deg);
            white-space: nowrap;
            padding: 1rem 0.25rem;
        }

        .table-muestras td {
            vertical-align: middle;
            padding: 0.5rem;
        }

        .table-muestras .form-control,
        .table-muestras .form-select {
            font-size: 0.8rem;
        }

        .table-muestras .form-check-input {
            width: 1.25em;
            height: 1.25em;
        }

        footer {
            margin-top: 3rem;
            padding: 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <header class="header-brand">
        <div class="container-fluid">
            <img src="{% static 'img/geolab-logo.png' %}" alt="Geolab">
        </div>
    </header>

    <div class="main-container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <strong>Geolab S.A.S</strong> &copy; {% now "Y" %} - Sistema de Gestión de Calidad.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
